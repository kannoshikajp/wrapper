; ===================================================================
; wrapper configuration file
; ===================================================================

[target]
; Target executable to launch (can be full path or command found in PATH)
; Supports environment variables, including %DIR% (wrapper directory)
executable = cmd.exe

; Arguments passed to the executable
; Supports %DIR% and environment variable expansion
arguments = /c echo Wrapper running from DIR=%DIR%, FOO=%FOO%, BAR=%BAR%

; Optional working directory (leave empty to inherit current directory)
; Example: working_dir = %DIR%
working_dir =

; Set to true or 1 to print wrapper diagnostics on launch
verbose = false

[env]
; Environment variables to set or override.
; Machine and user environment variables are preserved.
; %DIR% represents the directory where wrapper.exe stays.
; Existing environment variables can be expanded using %VAR_NAME%.
FOO = HelloFromWrapper
BAR = CustomValue
WRAPPER_LOCATION = %DIR%

; Example: Prepend wrapper's bin folder to PATH
; PATH = %DIR%\bin;%PATH%
